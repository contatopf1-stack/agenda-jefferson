<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F5E45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda Jefferson</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#F3F5F0; --card:#FFFFFF; --ink:#1E2A22; --muted:#55635A; --line:#DDE3DA; --line2:#C9D2C6;
  --sage:#3F5E45; --sage-d:#2C4431; --sage-l:#E3EEE4;
  --blue:#2F6FA8; --blue-l:#E4EEF7;
  --warn:#7A3A10; --warn-l:#FCEFE4; --red:#A3261B;
  --r:14px; --nav:76px;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
.hide{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.view{padding:calc(env(safe-area-inset-top) + 22px) 18px calc(var(--nav) + env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12.5px;font-weight:600;color:#4F6B55;text-transform:uppercase;letter-spacing:.06em}
.title{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;line-height:1.15}
.h2{font-size:16px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px}
.list{display:flex;flex-direction:column;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #D5DCD2;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid #D5DCD2;background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:#fff;border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;border:none;text-align:left}
.stat b{font-family:'Space Grotesk',sans-serif;font-size:24px}
.stat span{font-size:11.5px;color:var(--muted)}
.item{background:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;border:none;width:100%;text-align:left}
.item .tm{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.item .tm b{font-size:14px}
.item .tm span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.item .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .bd .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.done .bd .t{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px;white-space:nowrap;flex:none}
.tag.ok{background:var(--sage-l);color:var(--sage-d)}
.tag.due{background:var(--warn-l);color:var(--warn)}
.tag.info{background:var(--blue-l);color:#1D4E7A}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px;background:#fff;border-radius:14px}
.alert{background:var(--warn-l);color:var(--warn);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--sage);border-color:var(--sage)}
.check svg{width:16px;height:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{min-height:62px;border-radius:14px;border:none;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.day small{font-size:10.5px;font-weight:600}
.day b{font-size:17px}
.day.on{background:var(--sage);color:#fff}
.day.today:not(.on){outline:2px solid var(--sage);outline-offset:-2px}
.day i{position:absolute;bottom:7px;width:5px;height:5px;border-radius:3px;background:var(--sage)}
.day.on i{background:#fff}
.seg{display:flex;background:#E4E9E1;border-radius:12px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border:none;border-radius:10px;background:transparent;font-size:13px;font-weight:600}
.seg button.on{background:#fff}
.money{background:var(--ink);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.money .big{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700}
.money .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.money .grid div{background:#2C3B31;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.money small{font-size:12px;color:#C9D3CB}
.money .grid b{font-size:17px}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none}
.search{height:46px;border-radius:14px;border:1px solid var(--line2);background:#fff;padding:0 14px;width:100%}
.mini{background:#fff;border-radius:14px;padding:12px 14px;border:none;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 10px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
nav.tabs button.t{min-width:62px;min-height:50px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6A776E;font-size:11px;font-weight:600}
nav.tabs button.t.on{color:var(--sage);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.fab{width:58px;height:58px;border-radius:29px;background:var(--sage);border:none;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 16px rgba(63,94,69,.35)}
.fab svg{width:26px;height:26px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,28,22,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet:not(.open){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.open{transform:none}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:14px 12px 6px}
.sheet .hd h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;flex:1}
.sheet .bd{overflow-y:auto;padding:6px 18px 16px;display:flex;flex-direction:column;gap:16px}
.sheet .ft{padding:12px 18px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--line);display:flex;gap:10px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.type{min-height:62px;border-radius:14px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:0 14px;text-align:left}
.type b{font-size:14px}
.type span{font-size:11px;color:var(--muted)}
.type.on{border-color:var(--sage);background:var(--sage-l)}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:13px;font-weight:600}
.f input,.f select,.f textarea{height:50px;border-radius:14px;border:1px solid var(--line2);background:#fff;padding:0 14px;width:100%;font-size:16px}
.f textarea{height:auto;padding:12px 14px;resize:none}
.f input.valor{height:62px;font-size:26px;font-weight:700}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{height:54px;border-radius:16px;border:none;background:var(--sage);color:#fff;font-size:16px;font-weight:700;flex:1}
.btn.sec{background:#fff;color:var(--red);border:1px solid #E5C9C5;flex:none;padding:0 18px}
.btn.sec.arm{background:var(--red);color:#fff}
.btn:disabled{opacity:.6}
.kv{display:flex;flex-direction:column;gap:10px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.offline{background:var(--warn-l);color:var(--warn);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:10px}
/* login */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:22px;max-width:420px;margin:0 auto}
.logo{width:64px;height:64px;border-radius:18px;background:var(--sage);display:flex;align-items:center;justify-content:center}
.err{color:var(--red);font-size:13.5px;font-weight:600}
.spin{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--sage);border-radius:50%;animation:sp .8s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* print */
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;padding:24px;font-family:Inter,sans-serif;color:#000;font-size:12pt}
  #print table{width:100%;border-collapse:collapse;margin-top:12px}
  #print th,#print td{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left;font-size:11pt}
  #print td.v,#print th.v{text-align:right}
}
</style>
</head>
<body>
<div class="app">

  <!-- LOGIN -->
  <section id="login" class="login hide">
    <div class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
    <div><div class="title">Agenda</div><div class="sub" style="font-size:14px;margin-top:4px">Entre com o mesmo login do app de Entregas.</div></div>
    <form id="loginForm" class="list" style="gap:14px">
      <div class="f"><label for="lu">Usuário</label><input id="lu" autocomplete="username" autocapitalize="none" placeholder="jefferson" required></div>
      <div class="f"><label for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <div id="lerr" class="err hide"></div>
      <button class="btn" id="lbtn" type="submit" style="flex:none">Entrar</button>
    </form>
  </section>

  <!-- HOJE -->
  <section id="v-hoje" class="view hide">
    <div class="between" style="align-items:flex-start">
      <div class="list" style="gap:4px">
        <span class="eyebrow" id="hDate"></span>
        <h1 class="title" id="hHello"></h1>
      </div>
      <button class="iconbtn" id="hRefresh" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
    <div class="row">
      <button class="iconbtn" id="hPrev" aria-label="Dia anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="chip" id="hToday" style="flex:1">Hoje</button>
      <button class="iconbtn" id="hNext" aria-label="Próximo dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div id="hOff" class="offline hide">Sem internet — mostrando os últimos dados salvos.</div>
    <div class="stats" id="hStats"></div>
    <div class="list" id="hAlerts"></div>
    <div class="list">
      <div class="between"><h2 class="h2">Compromissos</h2><button class="chip" id="hAddEv">+ Adicionar</button></div>
      <div class="list" id="hEvents"></div>
    </div>
    <div class="list">
      <div class="between"><h2 class="h2">Entregas, coletas e retiradas</h2></div>
      <div class="chips" id="hFilt"></div>
      <div class="list" id="hRotas"></div>
    </div>
    <button class="mini" id="hCaixa"></button>
  </section>

  <!-- AGENDA -->
  <section id="v-agenda" class="view hide">
    <div class="between" style="align-items:flex-end">
      <div class="list" style="gap:4px"><span class="eyebrow" id="aMonth"></span><h1 class="title">Agenda</h1></div>
      <div class="row" style="gap:6px">
        <button class="iconbtn" id="aPrev" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="aNext" aria-label="Próxima semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="week" id="aWeek"></div>
    <div class="chips" id="aFilt"></div>
    <button class="mini" id="aOps"></button>
    <div class="list" id="aList"></div>
    <button class="chip" id="aAdd" style="align-self:flex-start">+ Novo compromisso neste dia</button>
  </section>

  <!-- CAIXA -->
  <section id="v-caixa" class="view hide">
    <div class="between" style="align-items:flex-end">
      <div class="list" style="gap:4px"><span class="eyebrow" id="cPer"></span><h1 class="title">Caixa</h1></div>
      <div class="seg" id="cSeg"><button data-p="semana" class="on">Semana</button><button data-p="mes">Mês</button></div>
    </div>
    <div class="row">
      <button class="iconbtn" id="cPrev" aria-label="Período anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="chip" id="cNow" style="flex:1">Período atual</button>
      <button class="iconbtn" id="cNext" aria-label="Próximo período"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="money">
      <div class="list" style="gap:2px"><small>Total de saídas</small><span class="big" id="cTot">R$ 0,00</span></div>
      <div class="grid"><div><small>Funcionários</small><b id="cFun">R$ 0,00</b></div><div><small>Minhas retiradas</small><b id="cRet">R$ 0,00</b></div></div>
    </div>
    <div class="list" id="cResumo"></div>
    <div class="list">
      <div class="between"><h2 class="h2">Lançamentos</h2><button class="chip" id="cPdf">Relatório PDF</button></div>
      <div class="list" id="cList"></div>
    </div>
  </section>

  <!-- NOTAS -->
  <section id="v-notas" class="view hide">
    <div class="between" style="align-items:flex-end">
      <div class="list" style="gap:4px"><span class="eyebrow">Informações importantes</span><h1 class="title">Notas</h1></div>
      <button class="chip" id="nAdd">+ Nova</button>
    </div>
    <input class="search" id="nSearch" type="search" placeholder="Buscar nas notas" aria-label="Buscar nas notas">
    <div class="list" id="nList"></div>
  </section>
</div>

<nav class="tabs hide" id="tabs"><div class="in">
  <button class="t on" data-v="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
  <button class="t" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
  <button class="fab" id="fab" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="t" data-v="caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/></svg>Caixa</button>
  <button class="t" data-v="notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16l-7-4-7 4z"/></svg>Notas</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="hd">
    <button class="iconbtn" id="sClose" aria-label="Fechar" style="border:none;background:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="sTitle">Novo lançamento</h2>
  </div>
  <div class="bd" id="sBody"></div>
  <div class="ft" id="sFoot"></div>
</div>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
const SB_URL = 'https://rscmuklleygnmbswnouu.supabase.co';
const SB_KEY = 'sb_publishable_uGVhmBoNnse5wLTT_Z7aKQ__9XW2Jqw';
const DOMINIO = '@pointfestt.app';
const DONO = 'jefferson@pointfestt.app';
const ENTREGAS_URL = 'https://entregasecoletaspoint.netlify.app/';
const RETIRADAS_URL = 'https://retiradaspoint.netlify.app/';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'agenda-jeff-auth' } });

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const decoder = document.createElement('textarea');
const dec = (s) => { decoder.innerHTML = String(s ?? ''); return decoder.value; };
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const monday = (s) => { const d = parse(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const DIAS3 = ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dLong = (s) => { const d = parse(s); return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const dShort = (s) => { const d = parse(s); return DIAS[d.getDay()].slice(0, 3) + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const brl = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const parseValor = (s) => { s = String(s || '').replace(/[^\d,.-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? null : Math.round(n * 100) / 100; };
const hhmm = (t) => (t ? String(t).slice(0, 5) : '');
const svgCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
let toastT;
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); };
const cacheSet = (k, v) => { try { localStorage.setItem('agj:' + k, JSON.stringify(v)); } catch (e) {} };
const cacheGet = (k) => { try { return JSON.parse(localStorage.getItem('agj:' + k)); } catch (e) { return null; } };
const prefGet = (k, d) => { const v = cacheGet('pref:' + k); return v == null ? d : v; };
const prefSet = (k, v) => cacheSet('pref:' + k, v);

// ---------- state ----------
const S = {
  view: 'hoje', hDia: today(), hFiltro: prefGet('hFiltro', 'todos'),
  aDia: today(), aFiltro: prefGet('aFiltro', 'todos'),
  cModo: 'semana', cRef: today(), nBusca: '',
  rotas: [], eventos: [], notas: [], lanc: [], pessoas: []
};

// ---------- auth ----------
async function boot() {
  const { data } = await sb.auth.getSession();
  if (data.session && isDono(data.session)) entrar(); else showLogin();
}
const isDono = (s) => (s?.user?.email || '').toLowerCase() === DONO;
function showLogin(msg) {
  ['#v-hoje', '#v-agenda', '#v-caixa', '#v-notas', '#tabs'].forEach((s) => $(s).classList.add('hide'));
  $('#login').classList.remove('hide');
  const e = $('#lerr'); if (msg) { e.textContent = msg; e.classList.remove('hide'); } else e.classList.add('hide');
}
$('#loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  let u = $('#lu').value.trim().toLowerCase(); if (!u.includes('@')) u += DOMINIO;
  const b = $('#lbtn'); b.disabled = true; b.textContent = 'Entrando…';
  const { data, error } = await sb.auth.signInWithPassword({ email: u, password: $('#lp').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (error) return showLogin('Usuário ou senha incorretos.');
  if (!isDono(data.session)) { await sb.auth.signOut(); return showLogin('Esta agenda é só do Jefferson.'); }
  entrar();
});
function entrar() {
  $('#login').classList.add('hide'); $('#tabs').classList.remove('hide');
  go(S.view);
}

// ---------- navigation ----------
function go(v) {
  S.view = v;
  ['hoje', 'agenda', 'caixa', 'notas'].forEach((x) => $('#v-' + x).classList.toggle('hide', x !== v));
  document.querySelectorAll('nav.tabs .t').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  window.scrollTo(0, 0);
  refresh();
}
document.querySelectorAll('nav.tabs .t').forEach((b) => b.addEventListener('click', () => go(b.dataset.v)));
$('#fab').addEventListener('click', () => abrirForm({ tipo: S.view === 'notas' ? 'nota' : S.view === 'agenda' ? 'compromisso' : 'pagamento' }));
function refresh() { ({ hoje: loadHoje, agenda: loadAgenda, caixa: loadCaixa, notas: loadNotas })[S.view](); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#tabs').classList.contains('hide')) refresh(); });
window.addEventListener('online', () => { if (!$('#tabs').classList.contains('hide')) refresh(); });

async function q(promise) {
  const { data, error } = await promise;
  if (error) { if (error.code === 'PGRST301' || /JWT/i.test(error.message)) { showLogin('Sua sessão expirou, entre de novo.'); } throw error; }
  return data;
}

// ---------- operação (apps de entregas / retiradas) ----------
async function fetchOps(ini, fim) {
  const f = `and(data->>dDate.gte.${ini},data->>dDate.lte.${fim}),and(data->>cDate.gte.${ini},data->>cDate.lte.${fim})`;
  const [o, r] = await Promise.all([
    q(sb.from('orders').select('id,data').or(f)),
    q(sb.from('retiradas').select('id,data').or(f))
  ]);
  return { o, r };
}
const EQ = { T: 'TONY', S: 'SILVIO' };
const restaPagar = (d) => (Array.isArray(d.pend) ? d.pend.reduce((a, p) => a + (Number(p.valor) || 0), 0) : 0);
function rotasDoDia(ops, dia) {
  const out = [];
  ops.o.forEach(({ data: d }) => {
    if (d.dDate === dia) out.push({ k: 'entrega', d, hora: d.dTime || '', feito: d.eSt === 'done', eq: EQ[d.equipe] || '' });
    if (d.cDate === dia) out.push({ k: 'coleta', d, hora: d.cTime || '', feito: d.cSt === 'done', eq: EQ[d.cEquipe] || '' });
  });
  ops.r.forEach(({ data: d }) => {
    if (d.dDate === dia) out.push({ k: 'retirada', d, hora: d.dTime || '', feito: d.eSt === 'done', eq: '' });
    if (d.cDate === dia) out.push({ k: 'devolucao', d, hora: d.cTime || '', feito: d.cSt === 'done', eq: '' });
  });
  const ord = { entrega: 0, coleta: 1, retirada: 2, devolucao: 3 };
  return out.sort((a, b) => (a.feito - b.feito) || ((a.hora || '99') < (b.hora || '99') ? -1 : (a.hora || '99') > (b.hora || '99') ? 1 : 0) || ord[a.k] - ord[b.k]);
}
const KIND = {
  entrega: { n: 'Entrega', c: 'var(--sage)', done: 'Entregue' },
  coleta: { n: 'Coleta', c: 'var(--blue)', done: 'Coletado' },
  retirada: { n: 'Retirada', c: '#8A5A00', done: 'Retirado' },
  devolucao: { n: 'Devolução', c: '#6B4BA0', done: 'Devolvido' }
};
function rotaHTML(r, i) {
  const K = KIND[r.k]; const resta = restaPagar(r.d);
  const turno = r.d.turno === 'm' ? 'Manhã' : r.d.turno === 't' ? 'Tarde' : '';
  const tag = r.feito ? `<span class="tag ok">${K.done}</span>` : resta > 0 ? `<span class="tag due">Resta ${brl(resta)}</span>` : `<span class="tag ok">Pago</span>`;
  const local = [dec(r.d.bairro), r.eq ? 'Equipe ' + r.eq : '', '#' + esc(r.d.num || '')].filter(Boolean).join(' · ');
  return `<button class="item${r.feito ? ' done' : ''}" data-rota="${i}">
    <div class="tm"><b>${esc(hhmm(r.hora) || turno || '—')}</b><span style="color:${K.c}">${K.n}</span></div>
    <div class="bd"><span class="t">${esc(dec(r.d.client))}</span><span class="sub">${esc(local)}</span></div>${tag}</button>`;
}
function abrirRota(r) {
  const K = KIND[r.k]; const resta = restaPagar(r.d);
  const app = r.k === 'entrega' || r.k === 'coleta' ? ENTREGAS_URL : RETIRADAS_URL;
  const linhas = [
    ['Tipo', K.n + (r.feito ? ' — ' + K.done : ' — pendente')],
    ['Pedido', '#' + (r.d.num || '')],
    ['Endereço', dec(r.d.addr || '')],
    ['Bairro', dec(r.d.bairro || '')],
    ['Equipe', r.eq],
    ['Entrega / retirada', r.d.dDate ? dShort(r.d.dDate) + (r.d.dTime ? ' ' + r.d.dTime : '') : ''],
    ['Coleta / devolução', r.d.cDate ? dShort(r.d.cDate) + (r.d.cTime ? ' ' + r.d.cTime : '') : ''],
    ['Pagamento', resta > 0 ? 'Resta pagar ' + brl(resta) : 'Pago'],
    ['Observação', dec(r.d.obs || '')]
  ].filter((l) => l[1]);
  sheet(dec(r.d.client), `<div class="kv">${linhas.map((l) => `<div><span>${esc(l[0])}</span><b>${esc(l[1])}</b></div>`).join('')}</div>`,
    `<a class="btn" href="${app}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Abrir no app de ${r.k === 'entrega' || r.k === 'coleta' ? 'Entregas' : 'Retiradas'}</a>`);
}

// ---------- HOJE ----------
async function loadHoje() {
  const dia = S.hDia, h = new Date().getHours();
  $('#hDate').textContent = dLong(dia);
  $('#hHello').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', Jefferson';
  $('#hToday').textContent = dia === today() ? 'Hoje' : 'Voltar para hoje';
  if (!S.rotas.length && !cacheGet('hoje:' + dia)) $('#hRotas').innerHTML = '<div class="spin"></div>';
  const seg = monday(today());
  try {
    const [ops, ev, notas, lc] = await Promise.all([
      fetchOps(dia, dia),
      q(sb.from('agenda_eventos').select('*').eq('data', dia).order('hora', { nullsFirst: true })),
      q(sb.from('agenda_notas').select('*').not('lembrete', 'is', null).lte('lembrete', dia).order('lembrete')),
      q(sb.from('agenda_lancamentos').select('tipo,valor').gte('data', seg).lte('data', addDays(seg, 6)))
    ]);
    const dados = { rotas: rotasDoDia(ops, dia), ev, notas, lc };
    cacheSet('hoje:' + dia, dados); $('#hOff').classList.add('hide');
    renderHoje(dados);
  } catch (e) {
    const c = cacheGet('hoje:' + dia);
    if (c) { $('#hOff').classList.remove('hide'); renderHoje(c); } else { $('#hRotas').innerHTML = '<div class="empty">Não consegui carregar. Verifique a internet e toque em atualizar.</div>'; }
  }
}
function renderHoje({ rotas, ev, notas, lc }) {
  S.rotas = rotas; S.eventos = ev; S.notas = notas;
  const n = (k) => rotas.filter((r) => r.k === k).length;
  const pend = (k) => rotas.filter((r) => r.k === k && !r.feito).length;
  const st = [['entrega', 'Entregas'], ['coleta', 'Coletas'], ['retirada', 'Retiradas'], ['devolucao', 'Devoluções']];
  $('#hStats').innerHTML = st.map(([k, l]) => `<button class="stat" data-f="${k}"><b>${n(k)}</b><span>${l}</span>${pend(k) ? `<span style="color:var(--warn);font-weight:600">${pend(k)} a fazer</span>` : ''}</button>`).join('');
  document.querySelectorAll('#hStats .stat').forEach((b) => b.addEventListener('click', () => { S.hFiltro = S.hFiltro === b.dataset.f ? 'todos' : b.dataset.f; prefSet('hFiltro', S.hFiltro); renderHoje({ rotas, ev, notas, lc }); }));
  // lembretes
  $('#hAlerts').innerHTML = notas.map((x) => `<div class="alert">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>
      <button data-nota="${x.id}" style="flex:1;border:none;background:none;text-align:left;padding:0;color:inherit"><b style="font-size:14px">${esc(x.titulo)}</b><div style="font-size:12.5px">${x.lembrete < S.hDia ? 'Atrasado · ' + dShort(x.lembrete) : 'Lembrete de hoje'}</div></button>
      <button class="chip" data-ok="${x.id}" style="min-height:34px;background:transparent;border-color:#E8C9AE;color:inherit">Feito</button></div>`).join('');
  document.querySelectorAll('#hAlerts [data-nota]').forEach((b) => b.addEventListener('click', () => abrirForm({ tipo: 'nota', reg: notas.find((x) => x.id === b.dataset.nota) })));
  document.querySelectorAll('#hAlerts [data-ok]').forEach((b) => b.addEventListener('click', async () => { await q(sb.from('agenda_notas').update({ lembrete: null, updated_at: new Date().toISOString() }).eq('id', b.dataset.ok)); toast('Lembrete concluído'); loadHoje(); }));
  // eventos
  $('#hEvents').innerHTML = ev.length ? ev.map(eventoHTML).join('') : '<div class="empty">Nenhum compromisso neste dia.</div>';
  bindEventos('#hEvents', ev, loadHoje);
  // filtros rotas
  const fs = [['todos', 'Todos'], ['pend', 'Pendentes'], ['entrega', 'Entregas'], ['coleta', 'Coletas'], ['retirada', 'Retiradas'], ['devolucao', 'Devoluções']];
  $('#hFilt').innerHTML = fs.map(([k, l]) => `<button class="chip${S.hFiltro === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('');
  document.querySelectorAll('#hFilt .chip').forEach((b) => b.addEventListener('click', () => { S.hFiltro = b.dataset.f; prefSet('hFiltro', S.hFiltro); renderHoje({ rotas, ev, notas, lc }); }));
  const vis = rotas.map((r, i) => [r, i]).filter(([r]) => S.hFiltro === 'todos' || (S.hFiltro === 'pend' ? !r.feito : r.k === S.hFiltro));
  $('#hRotas').innerHTML = vis.length ? vis.map(([r, i]) => rotaHTML(r, i)).join('') : '<div class="empty">Nada para mostrar neste dia.</div>';
  document.querySelectorAll('#hRotas [data-rota]').forEach((b) => b.addEventListener('click', () => abrirRota(rotas[+b.dataset.rota])));
  // caixa da semana
  const fun = lc.filter((l) => l.tipo === 'pagamento').reduce((a, l) => a + Number(l.valor), 0);
  const ret = lc.filter((l) => l.tipo === 'retirada').reduce((a, l) => a + Number(l.valor), 0);
  $('#hCaixa').innerHTML = `<div class="list" style="gap:3px"><b style="font-size:14px">Caixa desta semana</b><span class="sub">Funcionários ${brl(fun)} · Retiradas ${brl(ret)}</span></div><b>${brl(fun + ret)}</b>`;
}
$('#hPrev').addEventListener('click', () => { S.hDia = addDays(S.hDia, -1); loadHoje(); });
$('#hNext').addEventListener('click', () => { S.hDia = addDays(S.hDia, 1); loadHoje(); });
$('#hToday').addEventListener('click', () => { S.hDia = today(); loadHoje(); });
$('#hRefresh').addEventListener('click', () => { loadHoje(); toast('Atualizado'); });
$('#hAddEv').addEventListener('click', () => abrirForm({ tipo: 'compromisso', data: S.hDia }));
$('#hCaixa').addEventListener('click', () => { S.cModo = 'semana'; S.cRef = today(); go('caixa'); });

// ---------- eventos ----------
function eventoHTML(e) {
  const cor = e.categoria === 'pessoal' ? 'var(--blue)' : 'var(--sage)';
  return `<div class="item${e.feito ? ' done' : ''}" style="padding:10px 12px">
    <button class="check${e.feito ? ' on' : ''}" data-tog="${e.id}" aria-label="${e.feito ? 'Desmarcar' : 'Marcar como feito'}">${e.feito ? svgCheck : ''}</button>
    <div class="bar" style="background:${cor}"></div>

      <span class="bd" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="t" style="font-size:14px;font-weight:600;${e.feito ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(e.titulo)}</span>

}
function bindEventos(sel, lista, reload) {
  document.querySelectorAll(sel + ' [data-tog]').forEach((b) => b.addEventListener('click', async () => {
    const e = lista.find((x) => x.id === b.dataset.tog);
    try { await q(sb.from('agenda_eventos').update({ feito: !e.feito }).eq('id', e.id)); reload(); } catch (er) { toast('Sem conexão, tente de novo'); }
  }));
  document.querySelectorAll(sel + ' [data-ev]').forEach((b) => b.addEventListener('click', () => abrirForm({ tipo: 'compromisso', reg: lista.find((x) => x.id === b.dataset.ev) })));
}

// ---------- AGENDA ----------
async function loadAgenda() {
  const seg = monday(S.aDia), dom = addDays(seg, 6);
  const m1 = parse(seg), m2 = parse(dom);
  $('#aMonth').textContent = m1.getMonth() === m2.getMonth() ? MESES[m1.getMonth()] + ' ' + m1.getFullYear() : MESES[m1.getMonth()].slice(0, 3) + ' – ' + MESES[m2.getMonth()].slice(0, 3) + ' ' + m2.getFullYear();
  try {
    const [ev, ops] = await Promise.all([
      q(sb.from('agenda_eventos').select('*').gte('data', seg).lte('data', dom).order('hora', { nullsFirst: true })),
      fetchOps(seg, dom)
    ]);
    cacheSet('ag:' + seg, { ev, ops }); renderAgenda(ev, ops, seg);
  } catch (e) {
    const c = cacheGet('ag:' + seg); if (c) renderAgenda(c.ev, c.ops, seg); else $('#aList').innerHTML = '<div class="empty">Não consegui carregar. Verifique a internet.</div>';
  }
}
function renderAgenda(ev, ops, seg) {
  const t = today();
  $('#aWeek').innerHTML = [0, 1, 2, 3, 4, 5, 6].map((i) => {
    const d = addDays(seg, i); const tem = ev.some((e) => e.data === d);
    return `<button class="day${d === S.aDia ? ' on' : ''}${d === t ? ' today' : ''}" data-d="${d}" aria-label="${dLong(d)}"><small>${DIAS3[i]}</small><b>${parse(d).getDate()}</b>${tem ? '<i></i>' : ''}</button>`;
  }).join('');
  document.querySelectorAll('#aWeek .day').forEach((b) => b.addEventListener('click', () => { S.aDia = b.dataset.d; renderAgenda(ev, ops, seg); }));
  const fs = [['todos', 'Todos'], ['pessoal', 'Pessoal'], ['profissional', 'Profissional']];
  $('#aFilt').innerHTML = fs.map(([k, l]) => `<button class="chip${S.aFiltro === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('');
  document.querySelectorAll('#aFilt .chip').forEach((b) => b.addEventListener('click', () => { S.aFiltro = b.dataset.f; prefSet('aFiltro', S.aFiltro); renderAgenda(ev, ops, seg); }));
  const r = rotasDoDia(ops, S.aDia); const c = (k) => r.filter((x) => x.k === k).length;
  const partes = [[c('entrega'), 'entrega', 'entregas'], [c('coleta'), 'coleta', 'coletas'], [c('retirada'), 'retirada', 'retiradas'], [c('devolucao'), 'devolução', 'devoluções']].filter((p) => p[0]).map((p) => p[0] + ' ' + (p[0] === 1 ? p[1] : p[2]));
  $('#aOps').innerHTML = `<div class="list" style="gap:3px"><b style="font-size:14px">Operação · ${esc(dShort(S.aDia))}</b><span class="sub">${partes.length ? partes.join(' · ') : 'Sem entregas, coletas ou retiradas'}</span></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
  const lista = ev.filter((e) => e.data === S.aDia && (S.aFiltro === 'todos' || e.categoria === S.aFiltro));
  $('#aList').innerHTML = lista.length ? lista.map(eventoHTML).join('') : '<div class="empty">Nada marcado neste dia.</div>';
  bindEventos('#aList', lista, loadAgenda);
}
$('#aPrev').addEventListener('click', () => { S.aDia = addDays(S.aDia, -7); loadAgenda(); });
$('#aNext').addEventListener('click', () => { S.aDia = addDays(S.aDia, 7); loadAgenda(); });
$('#aAdd').addEventListener('click', () => abrirForm({ tipo: 'compromisso', data: S.aDia }));
$('#aOps').addEventListener('click', () => { S.hDia = S.aDia; go('hoje'); });

// ---------- CAIXA ----------
function periodo() {
  if (S.cModo === 'semana') { const a = monday(S.cRef); return { ini: a, fim: addDays(a, 6), label: 'Semana ' + dShort(a).slice(4) + ' a ' + dShort(addDays(a, 6)).slice(4) }; }
  const d = parse(S.cRef); const ini = iso(new Date(d.getFullYear(), d.getMonth(), 1)); const fim = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  return { ini, fim, label: MESES[d.getMonth()] + ' ' + d.getFullYear() };
}
async function loadCaixa() {
  const p = periodo(); $('#cPer').textContent = p.label;
  $('#cNow').textContent = S.cModo === 'semana' ? 'Semana atual' : 'Mês atual';
  try {
    const l = await q(sb.from('agenda_lancamentos').select('*').gte('data', p.ini).lte('data', p.fim).order('data', { ascending: false }).order('created_at', { ascending: false }));
    cacheSet('cx:' + p.ini + S.cModo, l); renderCaixa(l);
  } catch (e) { const c = cacheGet('cx:' + p.ini + S.cModo); if (c) renderCaixa(c); else $('#cList').innerHTML = '<div class="empty">Não consegui carregar. Verifique a internet.</div>'; }
}
function renderCaixa(l) {
  S.lanc = l;
  const fun = l.filter((x) => x.tipo === 'pagamento'), ret = l.filter((x) => x.tipo === 'retirada');
  const soma = (a) => a.reduce((s, x) => s + Number(x.valor), 0);
  $('#cTot').textContent = brl(soma(l)); $('#cFun').textContent = brl(soma(fun)); $('#cRet').textContent = brl(soma(ret));
  const grupo = (arr, k) => { const m = {}; arr.forEach((x) => { const n = x[k] || 'Sem nome'; m[n] = (m[n] || 0) + Number(x.valor); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const blocos = [];
  const gf = grupo(fun, 'pessoa'), gr = grupo(ret, 'empresa');
  if (gf.length) blocos.push(`<div class="card list" style="gap:8px"><b style="font-size:14px">Pagamentos por funcionário</b>${gf.map(([n, v]) => `<div class="between"><span>${esc(n)}</span><b>${brl(v)}</b></div>`).join('')}</div>`);
  if (gr.length) blocos.push(`<div class="card list" style="gap:8px"><b style="font-size:14px">Retiradas por empresa</b>${gr.map(([n, v]) => `<div class="between"><span>${esc(n)}</span><b>${brl(v)}</b></div>`).join('')}</div>`);
  $('#cResumo').innerHTML = blocos.join('');
  $('#cList').innerHTML = l.length ? l.map((x) => {
    const F = x.tipo === 'pagamento';
    return `<button class="item" data-l="${x.id}"><div class="av" style="background:${F ? 'var(--sage-l)' : 'var(--warn-l)'};color:${F ? 'var(--sage-d)' : 'var(--warn)'}">${F ? 'FU' : 'RE'}</div>
      <div class="bd"><span class="t">${esc(F ? (x.pessoa || 'Pagamento') : 'Retirada' + (x.empresa ? ' · ' + x.empresa : ''))}</span><span class="sub">${esc(dShort(x.data))}${x.forma ? ' · ' + esc(x.forma) : ''}${x.obs ? ' · ' + esc(x.obs) : ''}</span></div>
      <b style="font-size:14px;flex:none">${brl(x.valor)}</b></button>`;
  }).join('') : '<div class="empty">Nenhum lançamento neste período. Use o botão + para lançar.</div>';
  document.querySelectorAll('#cList [data-l]').forEach((b) => b.addEventListener('click', () => { const r = l.find((x) => x.id === b.dataset.l); abrirForm({ tipo: r.tipo, reg: r }); }));
}
document.querySelectorAll('#cSeg button').forEach((b) => b.addEventListener('click', () => { S.cModo = b.dataset.p; document.querySelectorAll('#cSeg button').forEach((x) => x.classList.toggle('on', x === b)); loadCaixa(); }));
const moveC = (n) => { if (S.cModo === 'semana') S.cRef = addDays(S.cRef, 7 * n); else { const d = parse(S.cRef); S.cRef = iso(new Date(d.getFullYear(), d.getMonth() + n, 1)); } loadCaixa(); };
$('#cPrev').addEventListener('click', () => moveC(-1));
$('#cNext').addEventListener('click', () => moveC(1));
$('#cNow').addEventListener('click', () => { S.cRef = today(); loadCaixa(); });
$('#cPdf').addEventListener('click', () => {
  const p = periodo(), l = S.lanc, soma = (a) => a.reduce((s, x) => s + Number(x.valor), 0);
  const fun = l.filter((x) => x.tipo === 'pagamento'), ret = l.filter((x) => x.tipo === 'retirada');
  const linhas = [...l].sort((a, b) => (a.data < b.data ? -1 : 1)).map((x) => `<tr><td>${esc(dShort(x.data))}</td><td>${x.tipo === 'pagamento' ? 'Pagamento' : 'Retirada'}</td><td>${esc(x.tipo === 'pagamento' ? x.pessoa || '' : x.empresa || '')}</td><td>${esc(x.forma || '')}</td><td>${esc(x.obs || '')}</td><td class="v">${brl(x.valor)}</td></tr>`).join('');
  $('#print').innerHTML = `<h2 style="margin:0">Caixa — ${esc(p.label)}</h2><p style="margin:6px 0 0">Funcionários: <b>${brl(soma(fun))}</b> · Retiradas: <b>${brl(soma(ret))}</b> · Total: <b>${brl(soma(l))}</b></p>
    <table><thead><tr><th>Data</th><th>Tipo</th><th>Para / de</th><th>Forma</th><th>Obs.</th><th class="v">Valor</th></tr></thead><tbody>${linhas || '<tr><td colspan="6">Sem lançamentos.</td></tr>'}</tbody></table>`;
  setTimeout(() => window.print(), 50);
});

// ---------- NOTAS ----------
async function loadNotas() {
  try { const n = await q(sb.from('agenda_notas').select('*').order('fixada', { ascending: false }).order('updated_at', { ascending: false })); cacheSet('notas', n); renderNotas(n); }
  catch (e) { const c = cacheGet('notas'); if (c) renderNotas(c); else $('#nList').innerHTML = '<div class="empty">Não consegui carregar. Verifique a internet.</div>'; }
}
function renderNotas(n) {
  S.notas = n; const b = S.nBusca.trim().toLowerCase();
  const vis = b ? n.filter((x) => [x.titulo, x.texto, x.etiqueta].join(' ').toLowerCase().includes(b)) : n;
  $('#nList').innerHTML = vis.length ? vis.map((x) => `<button class="item" data-n="${x.id}" style="align-items:flex-start">
    <div class="bd"><span class="t">${x.fixada ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="var(--sage)" aria-label="Fixada" role="img" style="margin-right:4px;vertical-align:-1px"><path d="M5 3h14v18l-7-4-7 4z"/></svg>' : ''}${esc(x.titulo)}</span>
    ${x.texto ? `<span class="sub" style="white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(x.texto)}</span>` : ''}
    <span class="row" style="gap:6px;margin-top:2px">${x.etiqueta ? `<span class="tag info">${esc(x.etiqueta)}</span>` : ''}${x.lembrete ? `<span class="tag due">Lembrete ${esc(dShort(x.lembrete))}</span>` : ''}</span></div></button>`).join('')
    : `<div class="empty">${b ? 'Nada encontrado.' : 'Nenhuma nota ainda. Guarde aqui senhas de fornecedor, contatos, combinados…'}</div>`;
  document.querySelectorAll('#nList [data-n]').forEach((el) => el.addEventListener('click', () => abrirForm({ tipo: 'nota', reg: n.find((x) => x.id === el.dataset.n) })));
}
$('#nSearch').addEventListener('input', (e) => { S.nBusca = e.target.value; renderNotas(S.notas); });
$('#nAdd').addEventListener('click', () => abrirForm({ tipo: 'nota' }));

// ---------- sheet ----------
function sheet(title, body, foot) {
  $('#sTitle').textContent = title; $('#sBody').innerHTML = body; $('#sFoot').innerHTML = foot || '';
  $('#sFoot').classList.toggle('hide', !foot);
  $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); $('#sBody').scrollTop = 0;
}
function fechar() { $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); }
$('#scrim').addEventListener('click', fechar); $('#sClose').addEventListener('click', fechar);

const TIPOS = [
  ['pagamento', 'Pagamento', 'funcionário / equipe'],
  ['retirada', 'Retirada', 'dinheiro que tirei'],
  ['compromisso', 'Compromisso', 'vai para a agenda'],
  ['nota', 'Anotação', 'informação importante']
];
const EMPRESAS = ['Point Festt', 'Locca Freezer', 'Zé Festeiro'];
const FORMAS = ['Pix', 'Dinheiro', 'Transferência'];
const chipSel = (name, opts, val) => `<div class="chips" data-sel="${name}">${opts.map((o) => `<button type="button" class="chip${o === val ? ' on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;

async function pessoas() {
  if (S.pessoas.length) return S.pessoas;
  try { const r = await q(sb.from('agenda_lancamentos').select('pessoa').eq('tipo', 'pagamento').not('pessoa', 'is', null).order('created_at', { ascending: false }).limit(200)); S.pessoas = [...new Set(r.map((x) => x.pessoa))]; } catch (e) {}
  return S.pessoas;
}

async function abrirForm({ tipo, reg, data }) {
  const edit = !!reg; const r = reg || {};
  const lista = [...new Set(['Equipe SILVIO', 'Equipe TONY', ...(await pessoas())])];
  const dataV = r.data || r.lembrete || data || (tipo === 'nota' ? '' : today());
  let body = '';
  if (!edit) body += `<div class="types">${TIPOS.map(([k, n, d]) => `<button type="button" class="type${k === tipo ? ' on' : ''}" data-t="${k}"><b>${n}</b><span>${d}</span></button>`).join('')}</div>`;
  if (tipo === 'pagamento' || tipo === 'retirada') {
    body += `<div class="f"><label for="fValor">Valor</label><input id="fValor" class="valor" inputmode="decimal" placeholder="R$ 0,00" value="${r.valor != null ? String(r.valor).replace('.', ',') : ''}"></div>`;
    if (tipo === 'pagamento') body += `<div class="f"><label for="fPessoa">Funcionário ou equipe</label><input id="fPessoa" list="dlP" placeholder="Ex.: Equipe TONY, ajudante…" value="${esc(r.pessoa || '')}"><datalist id="dlP">${lista.map((p) => `<option value="${esc(p)}">`).join('')}</datalist>
      <div class="chips">${lista.slice(0, 6).map((p) => `<button type="button" class="chip" data-fill="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>`;
    else body += `<div class="f"><label>Retirado de</label>${chipSel('empresa', EMPRESAS, r.empresa || 'Point Festt')}</div>`;
    body += `<div class="f"><label>Forma</label>${chipSel('forma', FORMAS, r.forma || 'Pix')}</div>`;
    body += `<div class="f"><label for="fData">Data</label><input id="fData" type="date" value="${dataV}"></div>`;
    body += `<div class="f"><label for="fObs">Observação</label><input id="fObs" placeholder="Ex.: diária de sábado" value="${esc(r.obs || '')}"></div>`;
  } else if (tipo === 'compromisso') {
    body += `<div class="f"><label for="fTit">O quê</label><input id="fTit" placeholder="Ex.: reunião com fornecedor" value="${esc(r.titulo || '')}"></div>`;
    body += `<div class="f"><label>Tipo</label>${chipSel('categoria', ['Profissional', 'Pessoal'], r.categoria === 'pessoal' ? 'Pessoal' : 'Profissional')}</div>`;
    body += `<div class="f2"><div class="f"><label for="fData">Data</label><input id="fData" type="date" value="${dataV}"></div><div class="f"><label for="fHora">Hora</label><input id="fHora" type="time" value="${hhmm(r.hora)}"></div></div>`;
    body += `<div class="f"><label for="fObs">Observação</label><input id="fObs" placeholder="Local, telefone, detalhe…" value="${esc(r.obs || '')}"></div>`;
  } else {
    body += `<div class="f"><label for="fTit">Título</label><input id="fTit" placeholder="Ex.: senha do portal do fornecedor" value="${esc(r.titulo || '')}"></div>`;
    body += `<div class="f"><label for="fTxt">Texto</label><textarea id="fTxt" rows="5" placeholder="Escreva o que precisa lembrar">${esc(r.texto || '')}</textarea></div>`;
    body += `<div class="f2"><div class="f"><label for="fEtq">Etiqueta</label><input id="fEtq" placeholder="Ex.: fornecedor" value="${esc(r.etiqueta || '')}"></div><div class="f"><label for="fData">Lembrar em</label><input id="fData" type="date" value="${dataV}"></div></div>`;
    body += `<label class="row" style="min-height:44px;font-weight:600;font-size:14px"><input id="fFix" type="checkbox" ${r.fixada ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--sage)"> Fixar no topo</label>`;
  }
  const titulos = { pagamento: 'Pagamento', retirada: 'Retirada', compromisso: 'Compromisso', nota: 'Anotação' };
  sheet(edit ? 'Editar ' + titulos[tipo].toLowerCase() : 'Novo lançamento', body,
    (edit ? '<button class="btn sec" id="fDel" type="button">Excluir</button>' : '') + '<button class="btn" id="fSave" type="button">Salvar</button>');
  document.querySelectorAll('#sBody .type').forEach((b) => b.addEventListener('click', () => abrirForm({ tipo: b.dataset.t, data })));
  document.querySelectorAll('#sBody [data-sel]').forEach((g) => g.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => { g.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c)); })));
  document.querySelectorAll('#sBody [data-fill]').forEach((c) => c.addEventListener('click', () => { $('#fPessoa').value = c.dataset.fill; }));
  const foco = $('#fValor') || $('#fTit'); if (foco && !edit) setTimeout(() => foco.focus(), 260);
  const sel = (n) => { const c = document.querySelector(`#sBody [data-sel="${n}"] .chip.on`); return c ? c.dataset.v : null; };
  $('#fSave').addEventListener('click', async () => {
    let tabela, row;
    if (tipo === 'pagamento' || tipo === 'retirada') {
      const v = parseValor($('#fValor').value); if (v == null || v <= 0) return toast('Digite o valor');
      if (!$('#fData').value) return toast('Escolha a data');
      tabela = 'agenda_lancamentos';
      row = { tipo, valor: v, forma: sel('forma'), data: $('#fData').value, obs: $('#fObs').value.trim() || null, pessoa: null, empresa: null };
      if (tipo === 'pagamento') { row.pessoa = $('#fPessoa').value.trim() || null; if (!row.pessoa) return toast('Diga quem recebeu'); } else row.empresa = sel('empresa');
    } else if (tipo === 'compromisso') {
      const t = $('#fTit').value.trim(); if (!t) return toast('Escreva o compromisso'); if (!$('#fData').value) return toast('Escolha a data');
      tabela = 'agenda_eventos';
      row = { titulo: t, categoria: sel('categoria') === 'Pessoal' ? 'pessoal' : 'profissional', data: $('#fData').value, hora: $('#fHora').value || null, obs: $('#fObs').value.trim() || null };
    } else {
      const t = $('#fTit').value.trim(); if (!t) return toast('Escreva um título');
      tabela = 'agenda_notas';
      row = { titulo: t, texto: $('#fTxt').value.trim() || null, etiqueta: $('#fEtq').value.trim() || null, lembrete: $('#fData').value || null, fixada: $('#fFix').checked, updated_at: new Date().toISOString() };
    }
    const b = $('#fSave'); b.disabled = true; b.textContent = 'Salvando…';
    try {
      if (edit) await q(sb.from(tabela).update(row).eq('id', r.id)); else await q(sb.from(tabela).insert(row));
      if (row.pessoa && !S.pessoas.includes(row.pessoa)) S.pessoas.unshift(row.pessoa);
      fechar(); toast(edit ? 'Alterado' : 'Salvo'); refresh();
    } catch (e) { b.disabled = false; b.textContent = 'Salvar'; toast('Não salvou — verifique a internet'); }
  });
  const del = $('#fDel');
  if (del) del.addEventListener('click', async () => {
    if (!del.classList.contains('arm')) { del.classList.add('arm'); del.textContent = 'Confirmar'; return; }
    const tabela = tipo === 'compromisso' ? 'agenda_eventos' : tipo === 'nota' ? 'agenda_notas' : 'agenda_lancamentos';
    try { await q(sb.from(tabela).delete().eq('id', r.id)); fechar(); toast('Excluído'); refresh(); } catch (e) { toast('Não excluiu — verifique a internet'); }
  });
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') showLogin(); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
boot();
})();
</script>
</body>
</html>
